name: Feature
description: Something Tansy, a plugin or a theme should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and why it's hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Could it be a plugin rather than a change to core?
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
