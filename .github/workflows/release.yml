name: Release

# Every package moves on its own version. A release is one or more tags on a commit, each naming a
# package at the version that commit holds, such as `@tansy/blog@0.1.2` or `tansy@0.2.0`; set them
# with scripts/set-version.mjs. A push of those tags publishes each one npm doesn't have yet, and
# nothing else. Pushing several tags at once starts a run for each, and the later ones find the
# work done. workflow_dispatch does everything except the publish itself, so a release can be
# rehearsed, for the releases given or for every package whose version isn't on npm.
on:
  push:
    tags: ["*@*", "@tansy/*@*"]
  workflow_dispatch:
    inputs:
      releases:
        description: Releases to rehearse, as <package>@<version> separated by spaces. Empty means every unpublished version.
        default: ""
        type: string
      tag:
        description: The npm dist-tag to publish under. Empty means latest, or next for a prerelease.
        default: ""
        type: string

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      # The OIDC token npm needs to attach provenance to each tarball.
      id-token: write
    env:
      TEST_DATABASE_URL: file:./.data/cms_release_test.db
    steps:
      - uses: actions/checkout@v7
        with:
          # Every release tag on this commit, not only the one that started the run.
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Each tag has to name the version the commit holds; the script stops here if one doesn't.
      - name: What this release publishes
        id: plan
        env:
          RELEASES: ${{ inputs.releases }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASES="$(git tag --points-at HEAD | grep '.@[0-9]' | tr '\n' ' ')"
          fi
          pending="$(node scripts/publish-packages.mjs --pending $RELEASES | tr '\n' ' ')"
          echo "releases=${pending% }" >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then echo "Nothing to publish: npm has every release named."; else echo "Releasing: $pending"; fi

      - if: steps.plan.outputs.releases != ''
        run: npm ci
      - if: steps.plan.outputs.releases != ''
        run: npm run check
      - name: Published metadata is up to date
        if: steps.plan.outputs.releases != ''
        run: node scripts/package-metadata.mjs --check
      - name: Every release is in its changelog
        if: steps.plan.outputs.releases != ''
        run: for release in ${{ steps.plan.outputs.releases }}; do node scripts/release-notes.mjs "$release" > /dev/null; done
      - name: Build every tarball
        if: steps.plan.outputs.releases != ''
        run: node scripts/build-packages.mjs
      - name: Install them into a fresh app and run the security suite against it
        if: steps.plan.outputs.releases != ''
        run: npm run test:package

      - name: Publish, as a rehearsal
        if: steps.plan.outputs.releases != '' && github.event_name == 'workflow_dispatch'
        run: node scripts/publish-packages.mjs --dry-run ${{ inputs.tag && format('--tag {0}', inputs.tag) || '' }} ${{ steps.plan.outputs.releases }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # A prerelease such as 0.2.0-beta.0 goes to `next`, so a plain install never picks it up.
      - name: Publish to npm
        if: steps.plan.outputs.releases != '' && github.event_name == 'push'
        run: node scripts/publish-packages.mjs ${{ steps.plan.outputs.releases }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Keep the tarballs with the run
        if: steps.plan.outputs.releases != ''
        uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: .release/*.tgz
          retention-days: 14

      - name: A GitHub release for each package, with its changelog's own words
        if: steps.plan.outputs.releases != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r release; do
            [ -n "$release" ] || continue
            tarball=".release/$(echo "$release" | sed -E 's/^@//; s#/#-#; s/@([^@]+)$/-\1.tgz/')"
            node scripts/release-notes.mjs "$release" > "$RUNNER_TEMP/notes.md"
            # The repository's latest release is the CMS's, not whichever plugin went out last.
            case "$release" in tansy@*) latest=true ;; *) latest=false ;; esac
            gh release create "$release" "$tarball" --title "$release" --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
          done < .release/published.txt
