name: Demo reset
# Puts the live demo at https://tansy-demo.vercel.app back to its baseline every hour, so visitors
# signed in with the shared account can change anything and the next ones still find it whole.
#
# The baseline is a second database, demo_baseline, on the demo's own Postgres server. A reset copies
# it over the live database with tansy backup and tansy restore; "baseline", run by hand, copies the
# live database into it instead. Run that after changing the demo's content or roles on purpose.
#
# Uploaded files are left alone: the demo's role can't change or delete files, so the baseline's
# are always still there.
#
# One repository secret: DEMO_DATABASE_URL, the demo's Postgres address from Vercel.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: reset puts the baseline back; baseline saves the demo as it is now
        type: choice
        options: [reset, baseline]
        default: reset

# Never a baseline and a reset at once.
concurrency:
  group: demo-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  demo:
    # Only the real repository holds the secret; forks would fail every hour.
    if: github.repository == 'mhmdsalahsebai/tansy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TASK: ${{ github.event_name == 'schedule' && 'reset' || inputs.task }}
      DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The archive only passes between two steps of this job, so its key and the secrets the CLI
      # checks are made up here, the same for both. The app's own secrets never leave Vercel.
      - name: Addresses and throwaway keys
        run: |
          # pg_dump needs a direct connection, not Neon's pooler.
          live="$(sed -E 's/-pooler\././' <<< "$DEMO_DATABASE_URL")"
          baseline="$(node -e 'const u = new URL(process.argv[1]); u.pathname = "/demo_baseline"; console.log(u.href)' "$live")"
          for value in "$live" "$baseline"; do echo "::add-mask::$value"; done
          {
            echo "LIVE_URL=$live"
            echo "BASELINE_URL=$baseline"
            echo "TANSY_BACKUP_KEY=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "TANSY_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      # pg_dump, pg_restore and psql must match the server's major version.
      - name: Postgres client tools
        run: |
          major="$(psql "$LIVE_URL" -Atc 'SHOW server_version_num' | cut -c1-2)"
          echo "Postgres server $major"
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -q "postgresql-client-$major" >/dev/null
          echo "TANSY_PG_BIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"

      - name: Save the baseline
        if: env.TASK == 'baseline'
        run: |
          exists="$(psql "$LIVE_URL" -Atc "SELECT 1 FROM pg_database WHERE datname = 'demo_baseline'")"
          [ "$exists" = 1 ] || psql "$LIVE_URL" -c 'CREATE DATABASE demo_baseline'
          DATABASE_URL="$LIVE_URL" npm run tansy -w tansy-starter -- backup --no-files --out "$RUNNER_TEMP/demo.tar.gz.enc"
          DATABASE_URL="$BASELINE_URL" npm run tansy -w tansy-starter -- restore "$RUNNER_TEMP/demo.tar.gz.enc" --no-files --yes --force --no-safety-copy

      - name: Restore the baseline
        if: env.TASK == 'reset'
        run: |
          # An empty or missing baseline would wipe the demo, so it has to hold collections first.
          collections="$(psql "$BASELINE_URL" -Atc 'SELECT count(*) FROM "Collection"')"
          [ "${collections:-0}" -gt 0 ] || { echo "The baseline holds no collections. Run this workflow with baseline first."; exit 1; }
          DATABASE_URL="$BASELINE_URL" npm run tansy -w tansy-starter -- backup --no-files --out "$RUNNER_TEMP/demo.tar.gz.enc"
          # --force: the demo keeps serving while this runs, so its connections are open.
          DATABASE_URL="$LIVE_URL" npm run tansy -w tansy-starter -- restore "$RUNNER_TEMP/demo.tar.gz.enc" --no-files --yes --force --no-safety-copy
